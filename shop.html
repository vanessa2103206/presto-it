<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presto.it - Shop</title>
    
<!-- Bootstrap CDN -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    
    <!-- Google Fonts (Nunito) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200..1000&display=swap" rel="stylesheet">
    <!-- CSS Personale globale -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. First Navbar (Barra Sconto) -->
    <nav class="navbar d-none d-md-block bg-first-custom" data-bs-theme="dark">
        <div class="container">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Sign up and get 20% OFF for your order</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 2. Second Navbar (Principale) -->
    <nav class="navbar navbar-expand-lg sticky-top shadow-sm" id="navbarColor">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 linkColor d-flex align-items-center" href="./index.html">
                <img src="./media/logo-g.png" alt="website logo" class="logo me-2" id="logo_navbar">
                Presto.it
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link linkColor" href="./index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active linkColor" aria-current="page" href="./shop.html">Shop</a>
                    </li>
                </ul>

                <!-- Barra di Ricerca con Icone Incorporate -->
                <form class="d-flex align-items-center" role="search">
                    <input class="form-control me-3" type="search" placeholder="Search" aria-label="Search">
                    <svg xmlns="http://w3.org" width="22" height="22" fill="currentColor" class="linkColor me-3" viewBox="0 0 16 16">
                        <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .49.598l-1 5a.5.5 0 0 1-.465.401l-9.397.472L4.415 11H13a.5.5 0 0 1 0 1H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l.84 4.479 9.144-.459L13.89 4zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                    </svg>
                    <svg xmlns="http://w3.org" width="22" height="22" fill="currentColor" class="linkColor" viewBox="0 0 16 16">
                        <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
                    </svg>
                </form>
            </div>
        </div>
    </nav>

    <!-- Titolo della Pagina -->
    <header class="container my-5 text-center">
        <h1 class="display-4 fw-bold text-dark mb-2">Our Shop</h1>
    </header>

    <!-- Griglia Principale dello Shop -->
    <main class="container my-5">
        <div class="row">
            
            <aside class="col-12 col-md-3 mb-4">
                <p class="fw-semibold text-muted mb-2">Filter by:</p>
                
                <div class="accordion" id="accordionExample">
                    
                    <div class="accordion-item border-secondary mb-1">
                        <h2 class="accordion-header" id="headingOne">
                            <button class="accordion-button bg-dark text-white shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true">
                                Category
                            </button>
                        </h2>
                        <div id="collapseOne" class="accordion-collapse collapse show" aria-labelledby="headingOne">
                            <div class="accordion-body bg-light" id="filtroCategoria">
                                <div class="form-check mb-2 d-flex align-items-center">
                                    <input class="form-check-input me-2 mt-0" type="radio" name="categories" id="All" checked >
                                    <label class="form-check-label fw-medium" for="All" >
                                        All
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 2. Filtro Prezzo -->
                    <div class="accordion-item border-secondary mb-1">
                        <h2 class="accordion-header" id="headingTwo">
                            <button class="accordion-button bg-dark text-white shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="true">
                                Price
                            </button>
                        </h2>
                        <div id="collapseTwo" class="accordion-collapse collapse show">
                            <div class="accordion-body bg-light" id="filtroPrezzo">
<input type="range" class="form-range" id="inputPrezzo">
                                <p class="mb-0 fw-medium text-dark" id="prezzoSelezionato">0 €</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 3. Filtro Parola -->
                    <div class="accordion-item border-secondary">
                        <h2 class="accordion-header" id="headingThree">
                            <button class="accordion-button bg-dark text-white shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree" aria-expanded="true">
                                Word
                            </button>
                        </h2>
                        <div id="collapseThree" class="accordion-collapse collapse show">
                            <div class="accordion-body bg-light" id="filtroParola">
                                <input type="text" class="form-control" id="inputParola" placeholder="Type a word...">
                            </div>
                        </div>
                    </div>

                </div> <!-- Fine Accordion -->
            </aside>

            <section class="col-12 col-md-9">
                <div class="row row-cols-1 row-cols-md-3 g-4" id="annunciContainer"></div>
            </section>

        </div>
    </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./shop.js"></script>
</body>
</html>

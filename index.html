<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presto.it</title>
    
   <!-- Bootstrap CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Google Fonts (Nunito) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200..1000&display=swap" rel="stylesheet">
    
    <!-- CSS Personale -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. First Navbar (Barra Sconto) -->
    <nav class="navbar d-none d-md-block bg-first-custom" data-bs-theme="dark">
        <div class="container">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Sign up and get 20% OFF for your order</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 2. Second  -->
    <nav class="navbar navbar-expand-lg sticky-top shadow-sm" id="navbarColor">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 linkColor d-flex align-items-center" href="./index.html">
                <img src="./media/logo-g.png" alt="website logo" class="logo me-2" id="logo_navbar">
                Presto.it
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                
                <!-- Lista dei Link di Navigazione -->
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active linkColor" aria-current="page" href="./index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link linkColor" href="./shop.html">Shop</a>
                    </li>
                </ul>

                <!-- Barra di Ricerca con Icone Incorporate Funzionanti -->
                <form class="d-flex align-items-center" role="search">
                    <input class="form-control me-3" type="search" placeholder="Search" aria-label="Search">
                    
                    <svg xmlns="http://w3.org" width="22" height="22" fill="currentColor" class="linkColor me-3" viewBox="0 0 16 16" >
                        <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .49.598l-1 5a.5.5 0 0 1-.465.401l-9.397.472L4.415 11H13a.5.5 0 0 1 0 1H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l.84 4.479 9.144-.459L13.89 4zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                    </svg>

                    <!-- Icona Omino Utente Nativa SVG -->
<svg xmlns="http://w3.org" width="22" height="22" fill="currentColor" class="linkColor" viewBox="0 0 16 16">
                        <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
                    </svg>
                </form>

            </div> <!-- Fine collapse -->
        </div> <!-- Fine container navbar -->
    </nav> <!-- Fine seconda navbar -->


    <!-- 3. Header Principale -->
    <header class="container-fluid main-header bg-hero d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center align-items-center">
            <div class="col-12 col-md-8 text-center header-content">
                <h1 class="display-4 fw-bold text-white mb-4">Level up your style with our<br>vintage market</h1>
<a href="./shop.html" class="btn-custom">Shop now <span class="ms-2 fw-bold">&rarr;</span></a>
            </div>
        </div>
    </header>


    <!-- 4. Sezione Numeri Incrementali (Soglie Aggiornate: 250, 180, 300) -->
    <section class="container my-5" id="sezioneContatori">
        <div class="row bg-dark text-white py-4 px-3 rounded shadow justify-content-center align-items-center text-center">
            <!-- Primo Contatore -->
            <div class="col-12 col-md-4 mb-3 mb-md-0">
                <p class="fs-4 mb-0 fw-semibold">
                    <span class="text-danger fw-bold display-6 me-2" id="countCustomers">250</span> Customers
                </p>
            </div>

            <!-- Secondo Contatore -->
            <div class="col-12 col-md-4 mb-3 mb-md-0">
                <p class="fs-4 mb-0 fw-semibold">
                    <span class="text-danger fw-bold display-6 me-2" id="countProducts">180</span> Sold products
                </p>
            </div>

            <!-- Terzo Contatore -->
            <div class="col-12 col-md-4">
                <p class="fs-4 mb-0 fw-semibold">
                    <span class="text-danger fw-bold display-6 me-2" id="countReviews">300</span> Positive reviews
                </p>
            </div>
        </div>
    </section>


    <!-- 5. Sezione Recensioni Dinamica Stile Personale (Funzionante) -->
    <section class="container-fluid">
        <div class="row justify-content-center bg-first-custom py-5">
            <article class="col-12 col-md-8">
                <h3 class="text-center text-white">Your Reviews!</h3>
                
                <div id="myCarousel" class="carousel slide" data-bs-ride="carousel">
                    <!-- Questo contenitore viene riempito interamente dal file JavaScript -->
                    <div class="carousel-inner" id="reviewsContainer"></div>
                    
                    <!-- Freccia di Navigazione Sinistra Legata a #myCarousel -->
                    <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    
                   
                    <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </article>
        </div>
    </section>


   
<div class="vh-100 bg-light d-flex align-items-center justify-content-center text-muted">
        <p>Scorri in basso per allontanarti e resettare i contatori</p>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
</body>
</html>
